[project]
name = "github-inbox-sift"
version = "0.1.0"
description = "A local, keyboard-first triage UI for GitHub notifications."
readme = "README.md"
license = "MIT"
authors = [{ name = "David Birks" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "platformdirs>=4.14.5",
    "tomli-w>=1.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
inbox-sift = "inbox_sift.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "inbox_sift"

[tool.pytest.ini_options]
testpaths = ["tests/py"]
asyncio_mode = "auto"
# Keep temp dirs only for failed tests: /tmp is a small quota-limited tmpfs on dev machines.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.ruff]
line-length = 110
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
